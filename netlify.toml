# Artha Indus Atelier
[build]
  command = "npm run build"
  publish = "."

# ---------------------------------------------------------------
# Keep repo-internal files out of the public site.
# `publish = "."` serves the whole repo, so anything committed here is
# reachable by URL unless it is explicitly blocked. These are working
# documents, not site content.
#
# `force = true` is required: without it Netlify serves the real file and
# never consults the rule.
#
# NOTE: do NOT blanket-block "*.md" — the journal renderer fetches
# /journal/<slug>.md at runtime and would break.
# ---------------------------------------------------------------
[[redirects]]
  from = "/REVIEW-NOTES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOYING.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/journal/POSTING-GUIDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------
# Security headers (from the security review).
#
# The CSP script-src hash covers the one inline snippet in every page
# head (the pre-paint theme setter). If that snippet ever changes,
# recompute its sha256 and update every CSP line below, or the snippet
# is silently blocked and night visitors see a light flash.
#
# CSP is set per page path, not on /*, because Netlify sends every
# matching header rule and two CSPs enforce as their intersection,
# which would break /admin/ (it needs unpkg and identity.netlify.com).
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-04omDNumpe4nBrBMGZFJQdpunjKDzYTp/+4A6H1q0pI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-04omDNumpe4nBrBMGZFJQdpunjKDzYTp/+4A6H1q0pI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"

